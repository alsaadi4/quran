<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استماع القرآن الكريم</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', 'Amiri', serif;
            background: linear-gradient(135deg, #0d1b2a 0%, #1b3a4b 50%, #0d1b2a 100%);
            min-height: 100vh;
            color: #e0e1dd;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 20px;
        }

        header h1 {
            font-family: 'Amiri', serif;
            font-size: 2.5rem;
            color: #e9c46a;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(233,196,106,0.3);
        }

        header p {
            color: #a8dadc;
            font-size: 1.1rem;
        }

        .bismillah {
            text-align: center;
            font-family: 'Amiri', serif;
            font-size: 1.8rem;
            color: #e9c46a;
            margin: 20px 0;
            padding: 15px;
            background: rgba(233,196,106,0.05);
            border-radius: 10px;
        }

        .search-box {
            width: 100%;
            padding: 15px 20px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            color: #e0e1dd;
            font-family: 'Tajawal', sans-serif;
            font-size: 1rem;
            margin-bottom: 20px;
            outline: none;
            transition: all 0.3s;
        }

        .search-box:focus {
            border-color: #e9c46a;
            background: rgba(255,255,255,0.08);
        }

        .search-box::placeholder {
            color: rgba(255,255,255,0.4);
        }

        .surah-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
            margin-bottom: 30px;
        }

        .surah-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 18px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .surah-card:hover {
            background: rgba(233,196,106,0.1);
            border-color: rgba(233,196,106,0.3);
            transform: translateY(-2px);
        }

        .surah-card.active {
            background: rgba(233,196,106,0.15);
            border-color: #e9c46a;
        }

        .surah-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .surah-number {
            width: 36px;
            height: 36px;
            background: rgba(233,196,106,0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #e9c46a;
            font-size: 0.9rem;
        }

        .surah-name {
            font-size: 1.15rem;
            font-weight: 700;
            color: #f1faee;
        }

        .surah-meta {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.5);
            margin-top: 3px;
        }

        .play-icon {
            width: 36px;
            height: 36px;
            background: rgba(233,196,106,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e9c46a;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .surah-card:hover .play-icon {
            background: #e9c46a;
            color: #0d1b2a;
        }

        .player-section {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, #0d1b2a 0%, #1b3a4b 100%);
            border-top: 1px solid rgba(233,196,106,0.2);
            padding: 20px;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
            z-index: 1000;
            display: none;
        }

        .player-section.active {
            display: block;
        }

        .player-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .now-playing {
            text-align: center;
            margin-bottom: 15px;
        }

        .now-playing h3 {
            color: #e9c46a;
            font-family: 'Amiri', serif;
            font-size: 1.4rem;
        }

        .now-playing p {
            color: rgba(255,255,255,0.6);
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .audio-player {
            width: 100%;
            height: 45px;
            border-radius: 10px;
            outline: none;
        }

        .reciter-select {
            margin-top: 15px;
            text-align: center;
        }

        .reciter-select label {
            color: rgba(255,255,255,0.6);
            font-size: 0.9rem;
            margin-left: 10px;
        }

        .reciter-select select {
            padding: 8px 15px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.05);
            color: #e0e1dd;
            font-family: 'Tajawal', sans-serif;
            outline: none;
            cursor: pointer;
        }

        .reciter-select select option {
            background: #1b3a4b;
            color: #e0e1dd;
        }

        .footer-note {
            text-align: center;
            padding: 100px 20px 40px;
            color: rgba(255,255,255,0.3);
            font-size: 0.85rem;
        }

        .footer-note a {
            color: #e9c46a;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 1.8rem;
            }
            .surah-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📖 القرآن الكريم</h1>
            <p>استماع مباشر لجميع السور — بصوت القارئ مشاري العفاسي</p>
        </header>

        <div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>

        <input type="text" class="search-box" id="searchBox" placeholder="🔍 ابحث عن سورة...">

        <div class="surah-list" id="surahList"></div>

        <div class="footer-note">
            <p>صدقة جارية — لله وحده 🌙</p>
            <p style="margin-top:8px">الصوت من مصدر: <a href="https://everyayah.com" target="_blank">everyayah.com</a></p>
        </div>
    </div>

    <div class="player-section" id="playerSection">
        <div class="player-container">

            <div class="reciter-select">

        const playerSection = document.getElementById('playerSection');
        const nowPlayingTitle = document.getElementById('nowPlayingTitle');
        const nowPlayingMeta = document.getElementById('nowPlayingMeta');
        const reciterSelect = document.getElementById('reciter');

        let currentSurah = null;

        function pad(num) {
            return num.toString().padStart(3, '0');
        }

        function renderSurahs(filter = '') {
            surahList.innerHTML = '';
            const filtered = surahs.filter(s => s.name.includes(filter));

            filtered.forEach(surah => {
                const card = document.createElement('div');
                card.className = 'surah-card' + (currentSurah && currentSurah.id === surah.id ? ' active' : '');
                card.innerHTML = `
                    <div class="surah-info">
                        <div class="surah-number">${surah.id}</div>
                        <div>
                            <div class="surah-name">${surah.name}</div>
                            <div class="surah-meta">${surah.type} — ${surah.verses} آية</div>
                        </div>
                    </div>
                    <div class="play-icon">▶</div>
                `;
                card.onclick = () => playSurah(surah);
                surahList.appendChild(card);
            });
        }

        function playSurah(surah) {
            currentSurah = surah;
            const reciter = reciterSelect.value;
            const url = `https://everyayah.com/data/${reciter}/${pad(surah.id)}.mp3`;

            audioPlayer.src = url;
            audioPlayer.play();

            playerSection.classList.add('active');
            nowPlayingTitle.textContent = `سورة ${surah.name}`;
            nowPlayingMeta.textContent = `${surah.type} — ${surah.verses} آية — ${reciterSelect.options[reciterSelect.selectedIndex].text}`;

            renderSurahs(searchBox.value);
        }

        reciterSelect.addEventListener('change', () => {
            if (currentSurah) {
                playSurah(currentSurah);
            }
        });

        searchBox.addEventListener('input', (e) => {
            renderSurahs(e.target.value);
        });

        renderSurahs();
